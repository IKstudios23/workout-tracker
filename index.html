<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<title>ProPath Training</title>
<style>
:root{
  --bg:#0d0f13;--s1:#15181e;--s2:#1c2028;--s3:#262b35;--line:#2a2f3a;
  --tx:#eef1f6;--mu:#8a93a5;--ac:#3d8bfd;--ac2:#2a6fe0;--acs:rgba(61,139,253,.14);
  --gold:#f6c343;--gold2:#b8860b;--ok:#2fbf71;--warn:#f2a33a;--bad:#ef5350;
  --fig:#e9edf4;--prop:#4a5265;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:14px 16px 170px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .tt{flex:1;text-align:center}
.h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mu);font-size:13px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;font-size:18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.mu{color:var(--mu)}
.sm{font-size:13px}
.lvl{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--s3)}
.lvl.HIGH{background:rgba(239,83,80,.18);color:#ff8a87}
.lvl.MED-HIGH{background:rgba(242,163,58,.18);color:#ffc067}
.lvl.LOW{background:rgba(47,191,113,.16);color:#6fe0a4}
.lvl.REST{background:var(--acs);color:#8cbcff}
.lvl.GAME{background:rgba(246,195,67,.18);color:var(--gold)}
.pbar{height:6px;border-radius:9px;background:var(--s3);overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.note{margin:6px 0 10px;color:var(--mu);font-size:13px}
.sport{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.sport input{width:20px;height:20px;accent-color:var(--ac);margin-top:1px;flex:none}
.sport b{display:block;font-size:14px}
.sport span{color:var(--mu);font-size:13px}
.hint{font-size:12.5px;color:var(--mu);margin:4px 2px 10px}
.exl{display:flex;flex-direction:column;gap:8px}
.ex-row{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer}
.ex-row:active{background:var(--s2)}
.ex-row.done{opacity:.6}
.ex-row.done .ex-name{text-decoration:line-through;text-decoration-color:var(--mu)}
.num{width:22px;text-align:center;color:var(--mu);font-weight:700;font-size:13px;flex:none}
.thumb{width:46px;height:40px;border-radius:10px;background:var(--s2);flex:none;overflow:hidden}
.thumb svg{width:100%;height:100%}
.ex-main{flex:1;min-width:0}
.ex-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-sub{font-size:12.5px;color:var(--mu)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--s3);color:#c3cad8}
.tag.ank{background:rgba(47,191,113,.15);color:#7ee2ab}
.tag.wu{background:rgba(242,163,58,.16);color:#ffc067}
.tag.ss{background:var(--acs);color:#8cbcff}
.tag.gold{background:rgba(246,195,67,.16);color:var(--gold);display:inline-flex;align-items:center;gap:3px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent;font-weight:800;font-size:15px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.full{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:#ff8a87;border-color:rgba(239,83,80,.4);background:transparent}
.add{margin-top:10px;width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:12px;color:var(--ac);font-weight:600}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.complete{background:linear-gradient(135deg,rgba(246,195,67,.18),rgba(61,139,253,.12));border-color:rgba(246,195,67,.35)}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,19,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
#nav .nin{max-width:560px;margin:0 auto;display:flex}
#nav button{flex:1;background:none;border:0;padding:9px 0 10px;color:var(--mu);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button.on{color:var(--ac)}
#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
#sheet,#picker{position:fixed;inset:0;z-index:30;display:none}
#sheet.open,#picker.open{display:block}
#picker{z-index:40}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;top:0;max-width:560px;margin:0 auto;background:var(--bg);overflow-y:auto;padding:0 16px 190px}
.panel.enter{animation:up .22s ease}
@media(min-width:600px){.panel{top:20px;border-radius:20px 20px 0 0;border:1px solid var(--line)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.sh-title{flex:1;font-weight:700;font-size:17px;text-align:center}
.tabs{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;margin:4px 0 12px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--s3);color:var(--tx)}
.tgt{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tgt b{font-size:16px}
.sug{font-size:13px;background:var(--s2);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sug.up{background:rgba(47,191,113,.12)}
.sug.down{background:rgba(239,83,80,.12)}
.sug button{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:5px 10px;font-weight:600;font-size:12.5px}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.sets{display:flex;flex-direction:column;gap:4px}
.srow{display:grid;gap:6px;align-items:center;padding:5px 6px;border-radius:10px}
.srow.hd{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;padding-bottom:0}
.srow.done{background:rgba(47,191,113,.12)}
.srow.warm .c-set{color:var(--warn)}
.c-set{font-weight:700;font-size:14px;display:flex;align-items:center;gap:3px}
.c-prev{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{width:100%;min-width:0;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--s2);text-align:center;font-weight:600;font-size:14.5px;padding:0 2px}
.in:focus{outline:2px solid var(--ac);border-color:transparent}
select.in{appearance:none;-webkit-appearance:none;font-size:13px}
.srow .chk{width:32px;height:32px;border-radius:9px}
.restchip{font-size:11.5px;margin:-1px 6px 3px 46px;color:var(--mu)}
.restchip b.ok{color:var(--ok)}.restchip b.long{color:var(--warn)}.restchip b.short{color:#8cbcff}
textarea.in{height:auto;min-height:60px;text-align:left;padding:8px 10px;font-weight:400;resize:vertical}
.medal{width:16px;height:16px;flex:none}
.medal.big{width:26px;height:26px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
/* details */
.demo{background:var(--s1);border:1px solid var(--line);border-radius:16px;aspect-ratio:200/170;max-height:300px;width:100%;display:grid;place-items:center;overflow:hidden}
.demo svg{width:100%;height:100%}
.vid{display:flex;justify-content:center;gap:6px;align-items:center;margin:8px 0 4px;color:var(--ac);font-weight:600;text-decoration:none;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
.bodies{display:flex;gap:6px;justify-content:center}
.body{width:46%;max-width:170px;height:auto}
.sil{fill:var(--s3)}
.mus{stroke:var(--bg);stroke-width:.6;transition:fill .3s}
.bl{font-size:6px;fill:var(--mu);text-anchor:middle;letter-spacing:.1em}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mu);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv>div{background:var(--s2);border-radius:12px;padding:10px}
.kv .k{font-size:11.5px;color:var(--mu)}
.kv .v{font-size:17px;font-weight:700;display:flex;align-items:center;gap:5px}
.kv .d{font-size:11px;color:var(--mu)}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:9px;fill:var(--mu)}
.empty{color:var(--mu);font-size:13px;text-align:center;padding:20px 8px}
.hist{border-top:1px solid var(--line);padding:9px 2px;font-size:13px}
.hist .dt{font-weight:600;margin-bottom:3px}
.hist .ln{color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 10px}
.hist .ln span{display:inline-flex;align-items:center;gap:3px}
/* timer */
#timer{position:fixed;left:0;right:0;bottom:62px;z-index:50;display:none;padding:0 10px calc(env(safe-area-inset-bottom))}
#timer.open{display:block}
body.sheet #timer{bottom:12px}
.tm{max-width:540px;margin:0 auto;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tm .row{gap:10px}
.tm-time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:86px}
.tm.over .tm-time{color:var(--warn)}
.tm-lab{font-size:12px;color:var(--mu);line-height:1.25}
.tm-bar{height:4px;background:var(--s3);border-radius:4px;margin-top:8px;overflow:hidden}
.tm-bar i{display:block;height:100%;background:var(--ac)}
.tm.over .tm-bar i{background:var(--warn)}
.tm button{border:1px solid var(--line);background:var(--s3);border-radius:10px;padding:7px 9px;font-weight:700;font-size:13px}
.tm button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
/* toast */
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.tst{background:var(--s3);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .3s ease}
.tst.gold{background:linear-gradient(135deg,#3a2f0c,#241d08);border-color:var(--gold2);color:#ffe7a3}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
/* plan */
.pday{padding:0;overflow:hidden}
.pday>.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.pday .pb{padding:0 14px 14px;border-top:1px solid var(--line)}
.pitem{display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.pitem .nm{font-weight:600;font-size:14px}
.pctl{display:flex;gap:4px;align-items:center}
.pctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--s2);font-size:13px}
.pnums{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mu);flex-wrap:wrap}
.pnums input{width:48px;height:28px;font-size:13px}
.field{display:block;margin:8px 0}
.field span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.field .in{text-align:left;padding:0 10px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat .v{font-size:19px;font-weight:800;display:flex;gap:4px;align-items:center}
.stat .k{font-size:11.5px;color:var(--mu)}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;margin-top:10px}
.mlist div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.badge-l{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}
.lib-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mtog{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:5px 10px;font-size:12.5px}
.mtog.p{background:var(--ac);border-color:var(--ac);color:#fff}
.mtog.s{background:#2b4f86;border-color:#2b4f86;color:#fff}
/* stick figure */
.fg line,.fg polyline{stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round;fill:none}
.fg .far{opacity:.38}
.fg .hd{fill:var(--fig)}
.fg .tor{fill:var(--fig)}
.pr-s{stroke:var(--prop);stroke-linecap:round;fill:none}
.pr-f{fill:var(--prop)}
.pr-a{fill:var(--ac)}
.pr-as{stroke:var(--ac);fill:none;stroke-linecap:round}
.gnd{stroke:var(--line);stroke-width:2}
</style>
</head>

<div id="app"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="picker"></div>
<div id="timer"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dkey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const pk=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dkey(d)};
const todayK=()=>dkey(new Date());
const fmtD=k=>{const d=pk(k);return MON[d.getMonth()]+' '+d.getDate()};
const fmtClock=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtW=w=>{w=+w;return Number.isInteger(w)?String(w):w.toFixed(1)};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const e1rm=(w,r)=>w*(1+r/30);
const MEDAL=(cls='')=>`<svg class="medal ${cls}" viewBox="0 0 24 24"><path d="M6.5 1.5h4.2l2 5.3-3.2 2z" fill="#3d8bfd"/><path d="M17.5 1.5h-4.2l-2 5.3 3.2 2z" fill="#2a6fe0"/><circle cx="12" cy="15" r="7.3" fill="url(#gg)" stroke="#a87b10" stroke-width="1"/><path d="M12 10.9l1.25 2.55 2.8.4-2.03 1.98.48 2.79L12 17.3l-2.5 1.32.48-2.79-2.03-1.98 2.8-.4z" fill="#fff7d6"/></svg>`;

/* ================= muscles ================= */
const MUS={chest:'Chest',delts:'Shoulders',rear_delts:'Rear shoulders',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms / grip',traps:'Traps',upper_back:'Upper back',lats:'Lats',lower_back:'Lower back',abs:'Abs',obliques:'Obliques',hip_flexors:'Hip flexors',glutes:'Glutes',abductors:'Outer hip (glute med)',adductors:'Groin / adductors',quads:'Quads',hamstrings:'Hamstrings',calves:'Calves',tibialis:'Shins (tibialis)',peroneals:'Outer ankle (peroneals)',feet:'Feet / ankle stabilizers'};

 ['forearms','M76,78 Q81.3,79 82.3,89 Q81.5,101 79.3,107 Q75,103 74,92 Z'],
 ['abs','M51,58.5 L58.5,58.5 Q60,78 58.5,98 L51,100 Z'],
 ['obliques','M60,58.5 Q67,61 68,73 Q67,88 61,99 Q62,78 60,58.5 Z'],

 ['adductors','M51,107 Q57,110 57,128 Q55,139 52,142 L51,140 Z'],
 ['quads','M58,110 Q66,103.5 69.5,116 Q71,138 66,157 Q61,160 57.5,154 Q55.5,132 58,110 Z'],
 ['tibialis','M60,165 Q65,164 65.8,175 Q64,193 62,202 Q59,195 59,177 Z'],
 ['peroneals','M66.4,166 Q69,172 68,186 Q67,195 64.4,200 Q66.4,183 66.4,166 Z'],

 ['feet','M56.5,205 L66,205 L70,211.5 L55.5,211.5 Z'],
];
const BACK=[
 ['traps','M50,23 L56,25 L67,32.5 L57.5,38 L51.5,48 L50,48 Z'],
 ['rear_delts','M65,32 Q76,31.5 78,43 Q73,48 67,44 Z'],
 ['upper_back','M51.5,49.5 L57.8,39.5 L64.5,40 Q65.5,48 60.5,56 L51,60 Z'],
 ['lats','M61,57 Q66.5,48.5 70,52 Q70.2,66 66.5,78 Q62.5,88 58.5,92 Q59.5,74 61,57 Z'],
 ['triceps','M70.5,47 Q78,49 79.4,61 Q78.5,71 75.3,76 Q71,67 70.5,56 Z'],
 ['forearms','M76,78 Q81.3,79 82.3,89 Q81.5,101 79.3,107 Q75,103 74,92 Z'],
 ['lower_back','M51,71 L57.5,71 Q59.5,86 57.5,96.5 L51,97.5 Z'],
 ['abductors','M62,95 Q69.5,96 70.3,106 Q66,103 61,101 Z'],
 ['glutes','M51,100 Q63,98.5 68.5,108 Q69.5,121 61,126 Q54,125 51,121 Z'],

const EXL={
 jump_rope:{n:'Jump rope',type:'T',cat:'Ankle',anim:'jumprope',pm:['calves'],sm:['tibialis','peroneals','feet'],steps:['Stay on the balls of your feet, knees soft.','Small, quiet hops: just high enough to clear the rope.','Turn the rope with your wrists, elbows tucked by your sides.','Mix two-foot, alternating-foot and single-leg hops.'],feel:'Calves and the springy part of your ankle.',avoid:'Landing on your heels, or jumping high and loud.'},
 sl_balance:{n:'Single-leg balance (eyes closed)',type:'T',uni:'per leg',cat:'Ankle',anim:'balance',pm:['feet','peroneals'],sm:['calves','abductors','tibialis'],steps:['Stand on one leg, knee slightly bent.','Close your eyes and hold.','If you touch down, just reset and keep the clock running.'],feel:'Tiny constant corrections in the foot and ankle. That IS the training: it rebuilds the position sense a sprain damages.',avoid:'Locking the knee or gripping the floor with your toes.'},
 wall_catch:{n:'Single-leg wall-ball catch',type:'T',uni:'per leg',cat:'Ankle',anim:'wallcatch',pm:['feet','peroneals'],sm:['abductors','calves','forearms'],steps:['Stand on one leg 3–4 ft from a wall.','Throw a tennis ball at the wall and catch it, alternating hands.','Keep the standing knee soft and hips level.'],feel:'Ankle and hip keeping you steady while your eyes are busy, like in a game.',avoid:'Putting the other foot down to make a catch.'},
 sl_calf:{n:'Single-leg calf raise (slow)',type:'B',uni:'per leg',cat:'Ankle',anim:'calf',pm:['calves'],sm:['feet','peroneals'],steps:['Ball of one foot on a step edge, heel hanging off.','Rise all the way up and hold 1 s.','Lower for 3 s into a deep stretch below the step.','Use a rail for balance only, not to help lift.'],feel:'Calf, especially in the bottom stretch.',avoid:'Bouncing, or cutting the range short.'},
 band_eversion:{n:'Band eversion',type:'R',uni:'per leg',cat:'Ankle',anim:'eversion',pm:['peroneals'],sm:['feet'],steps:['Sit with a band looped around the outside of your forefoot, anchored toward the inside.','Keep your heel down and shin still.','Turn the foot outward against the band, then return slowly.'],feel:'The outside of your lower leg: the muscles that stop the ankle rolling in.',avoid:'Rotating the whole leg instead of just the foot.'},
 knee_to_wall:{n:'Knee-to-wall ankle mobility',type:'R',uni:'per leg',cat:'Mobility',anim:'kneewall',pm:['calves'],sm:['tibialis','feet'],steps:['Face a wall with your front foot about 4 in (10 cm) away.','Keep the heel down and drive the knee forward to touch the wall.','Return and repeat. Move the foot back as it gets easier.'],feel:'Stretch in the calf and the front of the ankle.',avoid:'Heel lifting, or the knee caving inward.'},
 hip_flexor_stretch:{n:'Kneeling hip flexor stretch',type:'T',uni:'per side',cat:'Mobility',anim:'hipflex',pm:['hip_flexors'],sm:['quads'],steps:['Half-kneel with the back knee on a pad.','Squeeze the glute of the down knee and tuck your pelvis under.','Shift hips forward slightly; reach the same-side arm up for more stretch.'],feel:'Front of the hip on the kneeling side.',avoid:'Arching your lower back to fake the stretch.'},
 hip_9090:{n:'90/90 hip switches',type:'R',cat:'Mobility',anim:'n9090',pm:['glutes'],sm:['abductors','adductors','hip_flexors'],steps:['Sit with both knees bent 90°, one leg in front of you and one out to the side.','Rotate both knees over to the other side (no hands if you can).','Sit tall the whole time.'],feel:'Hip rotation on both sides.',avoid:'Slumping, or forcing range that pinches.'},
 bike_easy:{n:'Easy bike / walk (recovery)',type:'C',cat:'Cardio',anim:'cycle',pm:[],sm:['quads','calves'],steps:['Very easy pace: you could hold a full conversation.','Bike, elliptical or walk. Low impact is best.','The goal is blood flow and recovery, not fitness.'],feel:'Loose legs, nothing burning.',avoid:'Turning it into a hard workout.'},
 bike_z2:{n:'Zone 2 cardio (bike / elliptical)',type:'C',cat:'Cardio',anim:'cycle',pm:[],sm:['quads','glutes','calves'],steps:['Heart rate about 120–140 bpm.','You can talk in full sentences.','Bike first, then elliptical, then incline treadmill (easiest on the ankles first).'],feel:'Steady and sustainable. This builds the aerobic base that lets you recover between sprints, and burns fat.',avoid:'Going too hard. Zone 2 should feel almost too easy.'},
 intervals_4x4:{n:'4×4 intervals (bike / treadmill)',type:'C',cat:'Cardio',anim:'cycle',pm:[],sm:['quads','glutes','calves'],steps:['Warm up 5 min easy first.','4 min HARD: about 176–186 bpm, you can only say a few words.','3 min easy between (the rest timer).','4 rounds. Bike, or treadmill at 3–5% incline.'],feel:'Hard but even breathing. This protocol raised soccer players\' VO2max ~11% in research.',avoid:'Sprinting the first minute and dying. Pace it evenly.'},
 fifa11:{n:'FIFA 11+ warm-up',type:'C',cat:'Warm-up',anim:'run',pm:[],sm:['quads','hamstrings','adductors','glutes','calves'],yt:'FIFA 11+ warm up full program',steps:['Part 1 (8 min): jogging with hip out/in, side shuffles, jumps, short forward-back sprints.','Part 2 (10 min): plank, side plank, Nordics, single-leg balance, squats, jumps. Each has 3 levels.','Part 3 (2 min): running across the field, bounding, plant-and-cut.','Partner drills can be done solo.'],feel:'Warm, loose and ready. Cuts soccer injuries by about 30–50%.',avoid:'Rushing it on game day.'},
 landing:{n:'Landing drill (snap-down / box drop)',type:'R',cat:'Plyo',anim:'snapdown',pm:['quads','glutes'],sm:['calves','hamstrings','feet','abductors'],note:'Kept at 3×5: landings only train well while you\'re fresh.',steps:['Snap-down: rise onto your toes with arms overhead, whip arms down and drop into an athletic stance (hips back, knees bent, feet flat). Freeze.','Box drop: STEP (don\'t jump) off a 12–18 in box, land on two feet, quietly, knees over toes. Hold 3 s.','Weeks 3–4: single-leg hops with a 3 s hold. Weeks 5–8: clock hops, land-and-cut.'],feel:'Glutes and quads absorbing the landing, not your knees or heels.',avoid:'Loud landings, knees caving in, landing stiff-legged.'},
 back_squat:{n:'Back squat',type:'W',eq:'bb',wg:'legs',cat:'Legs',anim:'squat',pm:['quads','glutes'],sm:['adductors','hamstrings','lower_back','abs'],steps:['Bar on your upper traps, feet shoulder-width, toes slightly out.','Big breath into your belly and brace.','Sit down between your heels, knees tracking over your toes.','Go to where your hip crease reaches knee level while your back stays flat.','Drive up through your mid-foot.'],feel:'Quads and glutes.',avoid:'Knees caving in, heels lifting, chest collapsing forward.'},
 bss:{n:'Bulgarian split squat',type:'W',eq:'db',uni:'per leg',wg:'legs',cat:'Legs',anim:'split',pm:['quads','glutes'],sm:['adductors','hamstrings','feet'],steps:['Rear foot laces-down on a bench, front foot about 2 ft forward, dumbbells in hand.','Lean your torso slightly forward.','Lower straight down until your back knee nearly touches the floor.','Push through your front heel and mid-foot.'],feel:'Front glute and quad. If the stretch is mostly in your back hip, move the front foot further forward.',avoid:'Front knee caving in, or pushing off the back foot.'},
 nordic:{n:'Nordic hamstring curl',type:'B',cat:'Legs',anim:'nordic',pm:['hamstrings'],sm:['glutes','calves'],note:'Kept at 3×5 on purpose: 10 Nordics is too much hamstring stress and leaves you sore for days.',steps:['Kneel on a pad with heels anchored: decline bench (kneel on the seat facing AWAY from the rollers, heels hooked under), a padded loaded barbell, or the lat-pulldown knee pad.','Keep a straight line from knees to head, with no bend at the hips.','Lower forward as slowly as you can (aim 3–5 s).','Catch yourself in a push-up, push back up, and pull with your hamstrings.'],feel:'Hamstrings working hard while lengthening. Cuts hamstring injuries roughly in half.',avoid:'Bending at the hips to shorten the lever. Dropping fast at first is normal.'},
 leg_curl:{n:'Leg curl (machine)',type:'W',eq:'machine',wg:'post',cat:'Legs',anim:'legcurl',pm:['hamstrings'],sm:['calves'],steps:['Pad just above your heels, knees just off the edge of the bench.','Curl your heels toward your glutes, hips pressed down.','Squeeze 1 s, lower over 2–3 s.'],feel:'Back of the thighs.',avoid:'Hips lifting off the pad, or swinging the weight.'},
 copenhagen:{n:'Copenhagen plank',type:'T',uni:'per side',cat:'Core',anim:'copenhagen',pm:['adductors'],sm:['obliques','abs'],steps:['Side plank on your forearm with your TOP leg on a bench.','Start with the knee on the bench; progress to the ankle on the bench.','Bottom leg hangs under the bench. Lift your hips into a straight line and hold.'],feel:'Inner thigh of the top leg (groin). Protects the most-strained area in soccer.',avoid:'Hips sagging, or the shoulder shrugging up to your ear.'},
 seated_calf:{n:'Bent-knee calf raise (seated)',type:'W',eq:'machine',cat:'Legs',anim:'seatcalf',pm:['calves'],sm:['feet'],steps:['Seated calf machine, or sit on a bench with a dumbbell on your knees.','Balls of the feet on a plate or step.','Full stretch at the bottom, 1 s pause at the top.'],feel:'Lower calf (soleus), the muscle that absorbs landings.',avoid:'Bouncing at the bottom.'},
 band_walk:{n:'Banded lateral walk',type:'R',uni:'each way',cat:'Legs',anim:'bandwalk',pm:['abductors'],sm:['glutes'],steps:['Band just above your knees, quarter squat, toes forward.','Step sideways, keeping the band tight the whole time.','Push your knees out; don\'t let your feet come together.'],feel:'Side of the hip. This muscle stops knees and ankles collapsing inward on landings.',avoid:'Standing up tall, or rocking side to side.'},
 pallof:{n:'Pallof press',type:'W',eq:'cable',uni:'per side',cat:'Core',anim:'pallof',pm:['obliques','abs'],sm:['glutes'],steps:['Cable at chest height. Stand side-on to the machine holding the handle at your chest.','Press straight out and hold 2 s.','Don\'t let the cable twist you. Return slowly.'],feel:'Obliques and deep core resisting rotation: the athletic version of oblique work.',avoid:'Leaning away, or rotating toward the machine.'},
 hanging_knee:{n:'Hanging knee raise',type:'B',cat:'Core',anim:'legraise',pm:['abs','hip_flexors'],sm:['obliques','forearms'],steps:['Hang from a bar, shoulders engaged (not shrugged).','Curl your knees toward your chest by tilting your pelvis up.','Lower slowly without swinging.'],feel:'Lower abs.',avoid:'Swinging, or just lifting the knees without curling the pelvis.'},
 bench:{n:'Bench press',type:'W',eq:'bb',wg:'push',cat:'Upper',anim:'bench',pm:['chest'],sm:['delts','triceps'],steps:['Pinch shoulder blades together and down, feet planted, slight arch.','Lower the bar to your lower chest, elbows 45–60° from your body.','Press up and slightly back.'],feel:'Chest and triceps, not the front of your shoulders.',avoid:'Flared elbows, bouncing off the chest, butt lifting off the bench.'},
 pullup:{n:'Pull-up',type:'B',wg:'pull',cat:'Upper',anim:'pullup',pm:['lats'],sm:['upper_back','biceps','forearms','rear_delts'],steps:['Overhand grip (palms away), slightly wider than shoulders, from a dead hang.','Pull your shoulder blades DOWN first, then drive elbows down to your ribs.','Chin over the bar, chest up, no swinging.','Lower slowly (2–3 s) to a full hang.','Can\'t get 10? Use an assistance band or the lat pulldown for 3×10.'],feel:'Lats (the sides of your back). Harder than chin-ups, less biceps.',avoid:'Kipping, half reps, shrugging at the top.'},
 landmine:{n:'Half-kneeling landmine press',type:'W',eq:'bb',uni:'per side',wg:'push',cat:'Upper',anim:'landmine',pm:['delts'],sm:['triceps','chest','abs','obliques'],steps:['Wedge one end of a bar into a corner or landmine. Kneel with the pressing-side knee down.','Hold the other end at your shoulder.','Press up and forward. Squeeze the glute of the down knee.','No landmine? Half-kneeling single-arm dumbbell press.'],feel:'Shoulder and core.',avoid:'Leaning back or twisting.'},
 db_row:{n:'One-arm dumbbell row',type:'W',eq:'db',uni:'per side',wg:'pull',cat:'Upper',anim:'row',pm:['lats','upper_back'],sm:['biceps','rear_delts','forearms'],steps:['One hand and one knee on a bench, back flat.','Pull the dumbbell toward your HIP, elbow close.','Squeeze, then lower to a full stretch.'],feel:'Lats. If you feel it mostly in your biceps, think "elbow to back pocket".',avoid:'Twisting your torso to heave the weight.'},
 lat_raise:{n:'Lateral raise',type:'W',eq:'db',wg:'push',cat:'Upper',anim:'latraise',pm:['delts'],sm:['traps'],steps:['Light dumbbells at your sides, slight bend in the elbows.','Raise out to the sides to shoulder height, leading with your elbows.','Lower over 2–3 s.'],feel:'Side of the shoulders.',avoid:'Shrugging, swinging, going too heavy.'},
 face_pull:{n:'Face pull',type:'W',eq:'cable',wg:'pull',cat:'Upper',anim:'facepull',pm:['rear_delts','upper_back'],sm:['traps'],steps:['Rope attachment at face height.','Pull toward your forehead with elbows high and out.','Finish with hands back like a double-biceps pose. Squeeze.'],feel:'Rear shoulders and upper back. Keeps shoulders healthy.',avoid:'Leaning back to yank the weight.'},
 dead_bug:{n:'Dead bug',type:'R',uni:'per side',cat:'Core',anim:'deadbug',pm:['abs'],sm:['hip_flexors','obliques'],steps:['Lie on your back, arms straight up, knees bent 90° over your hips.','PRESS your lower back into the floor.','Slowly extend the opposite arm and leg while exhaling, return, switch sides.'],feel:'Deep abs.',avoid:'Lower back lifting off the floor. Shorten the reach if it does.'},
 side_plank:{n:'Side plank',type:'T',uni:'per side',cat:'Core',anim:'sideplank',pm:['obliques'],sm:['abs','abductors'],steps:['Forearm under your shoulder, feet stacked.','Lift hips so your body is one straight line.','Hold, breathing normally.'],feel:'Side of your waist.',avoid:'Hips sagging or rolling forward.'},
 cable_crunch:{n:'Cable crunch',type:'W',eq:'cable',cat:'Core',anim:'crunch',pm:['abs'],sm:['obliques'],steps:['Kneel facing a high cable, rope held by your head.','Keep your hips still and curl your ribs down toward your hips.','Squeeze the abs at the bottom, return slowly.'],feel:'Abs, not arms or hips.',avoid:'Sitting back on your heels to pull with bodyweight.'},
 pad_balance:{n:'Barefoot balance on pad',type:'T',uni:'per leg',cat:'Balance',anim:'balance',pm:['feet','peroneals'],sm:['calves','abductors'],steps:['Shoes off. Stand on one leg on a foam balance pad or folded mat.','Soft knee, hips level.','Progress: eyes closed, or turn your head side to side.'],feel:'Foot muscles working hard to keep you steady.',avoid:'Hips dropping on the free-leg side.'},
 ball_reaction:{n:'Tennis-ball wall reaction',type:'T',cat:'Balance',anim:'reaction',pm:['forearms'],sm:['delts'],steps:['Stand 3–4 ft from a wall.','Throw with one hand, catch with the other.','Progress: weak hand only, then faster and closer.'],feel:'Hand-eye speed.',avoid:'Watching your hands instead of the ball.'},
 two_ball:{n:'Two-ball dribble',type:'T',cat:'Balance',anim:'twoball',pm:['forearms'],sm:['delts'],steps:['Dribble two basketballs at the same time, then alternating.','Stay low, eyes up.','Mix heights: low, waist, crossovers.'],feel:'Both hands working independently: coordination for your weak hand.',avoid:'Looking down at the balls.'},

/* ================= sessions ================= */
const itemsFor=k=>{const s=S.sessions[k];return s?s.items:S.plan[pk(k).getDay()]};
function sess(k,create){let s=S.sessions[k];if(!s&&create){s=S.sessions[k]={items:clone(S.plan[pk(k).getDay()]),entries:{},started:[],soccer:false,bball:false}}return s}
const findItem=(k,uid)=>itemsFor(k).find(i=>i.uid===uid);
function ordered(k){const items=itemsFor(k),s=S.sessions[k];const st=(s?s.started:[]).map(u=>items.find(i=>i.uid===u)).filter(Boolean);return [...st,...items.filter(i=>!st.includes(i))]}
function newEntry(k,it){const ex=EX(it.ex),sug=suggest(it,k),sets=[];const hasW=TYPES[ex.type].w;
  for(let i=0;i<it.sets;i++)for(const side of(ex.uni?['L','R']:[null]))sets.push({i,side,w:hasW&&sug.w!=null?sug.w:null,v:null,rpe:null,done:false,rest:null});
  return {ex:it.ex,sets,warm:null,done:false,note:'',target:it.target,rest:it.rest.slice(),prs:[]}}
function entry(k,it,create){const s=sess(k,create);if(!s)return null;let e=s.entries[it.uid];if(!e&&create)e=s.entries[it.uid]=newEntry(k,it);return e||null}
function markStarted(k,uid){const s=sess(k,true);if(!s.started.includes(uid))s.started.push(uid)}
function warmOwners(k,focus){
  const items=itemsFor(k),s=S.sessions[k],own={},ord=ordered(k);
  const g=it=>{const ex=EX(it.ex);return hasWarm(ex)?ex.wg:null};
  for(const it of ord){const w=g(it),e=s&&s.entries[it.uid];if(w&&!own[w]&&e&&e.warm&&e.warm.some(x=>x.done))own[w]=it.uid}
  for(const it of ord){const w=g(it);if(w&&!own[w]&&s&&s.started.includes(it.uid))own[w]=it.uid}
  if(focus){const it=items.find(i=>i.uid===focus),w=it&&g(it);if(w&&!own[w])own[w]=focus}
  for(const it of ord){const w=g(it);if(w&&!own[w])own[w]=it.uid}
  return own;
}
const doneSets=e=>e.sets.filter(x=>x.done);
function workW(e){const x=e.sets.find(s=>+s.w>0);return x?+x.w:0}
function lastEntry(exId,before){const ks=Object.keys(S.sessions).filter(x=>x<before).sort().reverse();for(const kk of ks)for(const e of Object.values(S.sessions[kk].entries))if(e.ex===exId&&e.sets.some(s=>s.done))return {k:kk,e};return null}
function suggest(it,k){
  const ex=EX(it.ex),T=TYPES[ex.type],L=lastEntry(it.ex,k);
  if(!L)return {w:null,text:T.w===true?'First time: pick a weight you could lift about 12–13 times, so 10 reps leaves 2–3 in the tank (RPE 7–8).':'First time: log what you do and the next session gets a target.'};
  const d=doneSets(L.e),tgt=L.e.target||it.target,w=Math.max(0,...d.map(s=>+s.w||0));
  const hit=d.length>=L.e.sets.length&&d.every(s=>(+s.v||0)>=tgt);
  const rp=d.map(s=>+s.rpe).filter(x=>x>0),mx=rp.length?Math.max(...rp):null,step=STEP[ex.eq]||5;
  if(T.w===true||(T.w==='opt'&&w>0)){
    if(!hit||(mx&&mx>=9)){const nw=roundW(w*.92,ex.eq);return {w:nw,dir:'down',text:`Last time (${fmtW(w)} lb) was too hard${mx?` (RPE ${mx})`:''} or you missed reps. Drop to ${fmtW(nw)} lb and hit every rep.`}}
    if(mx==null||mx<=8){const inc=mx!=null&&mx<=6?step*2:step,nw=w+inc;return {w:nw,dir:'up',text:`You hit every rep at ${fmtW(w)} lb${mx?` (max RPE ${mx})`:''}, so add ${inc} lb: try ${fmtW(nw)} lb.`}}
    return {w,text:`Stay at ${fmtW(w)} lb until every set feels RPE 7–8, then add ${step} lb.`};
  }
  if(hit&&(mx==null||mx<=8))return {w:null,dir:'up',text:ex.type==='T'?`You held every set. Try ${tgt+5} s, or make it harder.`:ex.type==='B'?'All reps done. Add a little weight or slow the lowering.':'All done last time. Keep the quality high.'};
  return {w:null,text:'Last time you missed some reps. Same target, focus on quality.'};
}
function prevSet(exId,k,i,side){const L=lastEntry(exId,k);if(!L)return null;return L.e.sets.find(s=>s.i===i&&s.side===side&&s.done)||null}
function fmtSet(ex,s){const T=TYPES[ex.type];if(!s)return '–';const v=s.v==null?'':s.v;
  if(ex.type==='C')return `${v} min${s.hr?' · '+s.hr+' bpm':''}`;
  if(T.w===true)return `${fmtW(+s.w||0)}${ex.type==='WD'?' lb · ':'×'}${v}${ex.type==='WD'?' m':''}`;
  if(T.w==='opt'&&+s.w>0)return `+${fmtW(s.w)}×${v}`;
  return v+(ex.type==='T'?' s':ex.type==='D'?' m':'');}

/* ================= records & PRs ================= */
function fold(st,x){const w=+x.w||0,v=+x.v||0;st.maxW=Math.max(st.maxW,w);st.maxV=Math.max(st.maxV,v);if(w&&v){st.max1=Math.max(st.max1,e1rm(w,v));st.maxVol=Math.max(st.maxVol,w*v)}}
function histStats(exId,except){const st={maxW:0,max1:0,maxVol:0,maxV:0,maxSess:0,n:0};
  for(const [k,s] of Object.entries(S.sessions)){if(k===except)continue;for(const e of Object.values(s.entries)){if(e.ex!==exId)continue;let sv=0,any=false;for(const x of e.sets){if(!x.done)continue;any=true;fold(st,x);sv+=(+x.w||0)*(+x.v||0)}if(any){st.n++;st.maxSess=Math.max(st.maxSess,sv)}}}
  return st}
function prCheck(k,uid,e,idx){
  const ex=EX(e.ex),T=TYPES[ex.type],st=histStats(e.ex,k);if(!st.n)return [];
  for(const [u,e2] of Object.entries(S.sessions[k].entries)){if(e2.ex!==e.ex)continue;e2.sets.forEach((x,j)=>{if(x.done&&!(u===uid&&j===idx))fold(st,x)})}
  const x=e.sets[idx],w=+x.w||0,v=+x.v||0,out=[];
  if(T.w&&w>0){if(w>st.maxW)out.push('Heaviest weight');if(ex.type==='W'&&v>0&&e1rm(w,v)>st.max1+.01)out.push('Best est. 1RM');if(ex.type!=='WD'&&v>0&&w*v>st.maxVol)out.push('Best set volume')}
  else if(ex.type==='B'&&v>st.maxV)out.push('Most reps');
  else if(ex.type==='T'&&v>st.maxV)out.push('Longest hold');
  else if(ex.type==='D'&&v>st.maxV)out.push('Longest distance');
  return out}
function sessVol(e){return doneSets(e).reduce((a,x)=>a+(+x.w||0)*(+x.v||0),0)}

/* ================= rest timer ================= */
function setDur(ex,s){return ex.type==='T'?(+s.v||30):ex.type==='C'?0:Math.max(15,(+s.v||10)*3)}
function startTimer(k,uid,idx,dur,warm){S.timer={k,uid,idx,start:Date.now(),dur,warm:!!warm,beeped:false};save();buildTimer()}
function finishTimer(est,newSetDur){const t=S.timer;if(!t)return;S.timer=null;
  if(!t.warm){const s=S.sessions[t.k],e=s&&s.entries[t.uid],x=e&&e.sets[t.idx];if(x){let r=(Date.now()-t.start)/1000;if(est)r-=newSetDur||0;x.rest=Math.max(0,Math.round(r));x.restEst=!!est}}
  save();buildTimer()}
function buildTimer(){const el=$('#timer'),t=S.timer;if(!t){el.className='';el.innerHTML='';return}
  const it=findItem(t.k,t.uid),name=it?EX(it.ex).n:'';
  el.className='open';el.innerHTML=`<div class="tm" id="tmb"><div class="row"><div class="tm-time" id="tmt">0:00</div><div class="sp tm-lab"><b>${t.warm?'Warm-up rest':'Rest'}</b><br>${esc(name)}</div><button onclick="A.tAdj(-15)">−15</button><button onclick="A.tAdj(15)">+15</button><button class="pri" id="tme" onclick="A.tEnd()">Skip</button></div><div class="tm-bar"><i id="tmi"></i></div></div>`;tickTimer()}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.18);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function tickTimer(){const t=S.timer;if(!t||!$('#tmt'))return;const el=(Date.now()-t.start)/1000,left=t.dur-el;
  $('#tmt').textContent=left>=0?fmtClock(left):'+'+fmtClock(-left);$('#tmb').classList.toggle('over',left<0);
  $('#tmi').style.width=Math.min(100,el/t.dur*100)+'%';$('#tme').textContent=left>0?'Skip':'Next set';
  if(left<=0&&!t.beeped){t.beeped=true;save();beep()}}
setInterval(tickTimer,250);

function fmtRest(r){if(!r||!r[1])return '';const[a,b]=r;const f=x=>x>=120&&x%60===0?(x/60)+' min':x+' s';if(a===b)return f(a);if(a>=120&&b%60===0)return `${a/60}–${b/60} min`;return `${a}–${b} s`}
function unitOf(ex){return ex.vlabel||({T:'s',D:'m',WD:'m',C:'min'}[ex.type]||'reps')}
function fmtTarget(it,ex){ex=ex||EX(it.ex);const u=unitOf(ex);const per=ex.uni?' '+ex.uni:'';
  if(ex.type==='C')return it.sets>1?`${it.sets} × ${it.target} min`:`${it.target} min`;
  if(ex.type==='T')return `${it.sets} × ${it.target} s${per}`;
  return `${it.sets} × ${it.target}${u==='reps'?'':' '+u}${per}`}
function restClass(r,band){if(r==null||!band||!band[1])return '';if(r>band[1]+10)return 'long';if(r<band[0]-10)return 'short';return 'ok'}

function exRow(k,it,i,own){
  const ex=EX(it.ex),s=S.sessions[k],e=s&&s.entries[it.uid],done=!!(e&&e.done);
  const pi=itemsFor(k).indexOf(it);
  const tags=[];
  if(ex.cat==='Ankle')tags.push('<span class="tag ank">Ankle</span>');
  if(own[ex.wg]===it.uid&&hasWarm(ex)&&!(e&&e.warm&&e.warm.every(x=>x.done)))tags.push('<span class="tag wu">Warm-up ×3</span>');
  if(it.ss)tags.push(`<span class="tag ss">Superset ${it.ss}</span>`);
  if(it.opt)tags.push('<span class="tag">Optional</span>');
  const nb=e?e.sets.reduce((a,x)=>a+(x.pr?x.pr.length:0),0)+(e.prs?e.prs.length:0):0;
  if(nb)tags.push(`<span class="tag gold">${MEDAL()}×${nb}</span>`);
  if(pi!==i&&s&&s.started.includes(it.uid))tags.push(`<span class="tag">Planned #${pi+1}</span>`);
  const nd=e?doneSets(e).length:0,tot=e?e.sets.length:0;
  const sub=fmtTarget(it,ex)+(it.rest[1]?' · rest '+fmtRest(it.rest):'')+(nd&&!done?` · ${ex.uni?Math.floor(nd/2):nd}/${ex.uni?tot/2:tot} sets`:'');
  return `<div class="ex-row ${done?'done':''}" onclick="A.open('${it.uid}')"><div class="num">${i+1}</div><div class="thumb">${thumbSVG(ex.anim)}</div><div class="ex-main"><div class="ex-name">${esc(ex.n)}</div><div class="ex-sub">${sub}</div>${tags.length?`<div class="tags">${tags.join('')}</div>`:''}</div><button class="chk ${done?'on':''}" onclick="event.stopPropagation();A.toggleDone('${it.uid}')" aria-label="Mark done">✓</button></div>`}
function vToday(){
  const k=ui.date,d=pk(k),dow=d.getDay(),info=S.days[dow],s=S.sessions[k],isT=k===todayK();

  let badges=0;if(s)for(const e of Object.values(s.entries))badges+=e.sets.reduce((a,x)=>a+(x.pr?x.pr.length:0),0)+(e.prs?e.prs.length:0);

  ${allDone?`<div class="card complete"><div class="row">${MEDAL('big')}<div><b>Workout complete</b><div class="sm mu">${items.length} exercises${badges?` · ${badges} gold badge${badges>1?'s':''}`:''}. Recover well.</div></div></div></div>`:''}
  <div class="card"><div class="row"><span class="lvl ${info.lvl}">${info.lvl}</span><span class="sp"></span><span class="sm mu">${nd}/${items.length} done</span></div>
  <div class="pbar"><i style="width:${items.length?nd/items.length*100:0}%"></i></div>
  <div class="note">${esc(info.note)}</div>
  <label class="sport"><input type="checkbox" ${s&&s.soccer?'checked':''} onchange="A.sport('soccer',this.checked)"><div><b>Soccer focus</b><span>${esc(info.soccer)}</span></div></label>
  <label class="sport"><input type="checkbox" ${s&&s.bball?'checked':''} onchange="A.sport('bball',this.checked)"><div><b>Basketball focus</b><span>${esc(info.bball)}</span></div></label></div>
  <div class="hint">Tap any exercise to open it, in any order. Whatever you start moves up the list, and the 3 warm-up sets follow the first lift you start for each muscle group.</div>
  <div class="exl">${items.map((it,i)=>exRow(k,it,i,own)).join('')}</div>
  <button class="add" onclick="A.pick('today')">+ Add exercise</button>`}

/* ================= exercise sheet ================= */
function setGrid(ex){const T=TYPES[ex.type];
  if(ex.type==='W'||ex.type==='B')return '38px minmax(0,1fr) 58px 48px 50px 34px';
  if(ex.type==='WD'||ex.type==='C')return '38px minmax(0,1fr) 62px 62px 34px';
  return '38px minmax(0,1fr) 70px 34px'}
function setHeader(ex){const g=setGrid(ex);let c=['Set','Previous'];
  if(ex.type==='W')c.push('lb','Reps','RPE');else if(ex.type==='B')c.push('+lb','Reps','RPE');else if(ex.type==='WD')c.push('lb','m');else if(ex.type==='C')c.push('Min','Avg HR');else c.push(TYPES[ex.type].val==='Reps'?(ex.vlabel?'Count':'Reps'):TYPES[ex.type].val);
  c.push('');return `<div class="srow hd" style="grid-template-columns:${g}">${c.map(x=>`<div style="text-align:${x==='Set'||x==='Previous'?'left':'center'}">${x}</div>`).join('')}</div>`}
const RPES=['','6','7','7.5','8','8.5','9','10'];
function setRow(k,it,e,ex,idx,sug){
  const s=e.sets[idx],g=setGrid(ex),pv=prevSet(it.ex,k,s.i,s.side);
  const lab=(s.i+1)+(s.side||'');
  const inp=(f,ph,val,mode)=>`<input class="in" inputmode="${mode||'decimal'}" data-set="${idx}" data-f="${f}" value="${val==null?'':esc(val)}" placeholder="${esc(ph)}" onchange="A.setVal(${idx},'${f}',this.value)">`;
  let cells='';
  const wph=sug&&sug.w!=null?fmtW(sug.w):(pv&&pv.w!=null?fmtW(pv.w):'');
  if(ex.type==='W'||ex.type==='B'){cells+=inp('w',ex.type==='B'?'0':wph,s.w)+inp('v',e.target,s.v,'numeric')+`<select class="in" onchange="A.setVal(${idx},'rpe',this.value)">${RPES.map(r=>`<option value="${r}" ${String(s.rpe||'')===r?'selected':''}>${r||'–'}</option>`).join('')}</select>`}
  else if(ex.type==='WD')cells+=inp('w',wph,s.w)+inp('v',e.target,s.v,'numeric');
  else if(ex.type==='C')cells+=inp('v',e.target,s.v,'numeric')+inp('hr','bpm',s.hr,'numeric');
  else cells+=inp('v',e.target,s.v,'numeric');
  const pr=s.pr&&s.pr.length?`<span title="${esc(s.pr.join(', '))}">${MEDAL()}</span>`:'';
  let row=`<div class="srow ${s.done?'done':''}" style="grid-template-columns:${g}"><div class="c-set">${lab}${pr}</div><div class="c-prev">${pv?fmtSet(ex,pv):'–'}</div>${cells}<button class="chk ${s.done?'on':''}" onclick="A.toggleSet(${idx})" aria-label="Complete set">✓</button></div>`;
  if(s.rest!=null){const c=restClass(s.rest,e.rest);row+=`<div class="restchip">Rest after: <b class="${c}">${fmtClock(s.rest)}</b>${s.restEst?' (est.)':''}${c==='long'?' · longer than target':c==='short'?' · shorter than target':c==='ok'?' · on target':''}</div>`}
  return row}
function warmBlock(k,it,e,ex){
  if(!hasWarm(ex))return '';
  const own=warmOwners(k,it.uid)[ex.wg];
  if(own!==it.uid){const o=findItem(k,own);return `<div class="sec-h">Warm-up</div><div class="sm mu" style="margin:0 2px 6px">Already covered by <b>${esc(o?EX(o.ex).n:'another lift')}</b> for this muscle group, so go straight to your working sets.</div>`}
  if(!e.warm)e.warm=[0,1,2].map(()=>({w:null,done:false}));
  const g='38px minmax(0,1fr) 70px 44px 34px';
  let rows='';
  if(ex.type==='W'){const W=workW(e)||(suggest(it,k).w||0);
    rows=LADDER.map((L,i)=>{const wv=e.warm[i].w!=null?e.warm[i].w:(W?roundW(W*L.p,ex.eq):'');
      return `<div class="srow warm ${e.warm[i].done?'done':''}" style="grid-template-columns:${g}"><div class="c-set">W${i+1}</div><div class="c-prev">${L.label} of working</div><input class="in" inputmode="decimal" data-warm="${i}" data-auto="${e.warm[i].w==null?1:0}" value="${wv}" placeholder="lb" onchange="A.warmW(${i},this.value)"><div style="text-align:center;font-weight:600">×${L.r}</div><button class="chk ${e.warm[i].done?'on':''}" onclick="A.toggleWarm(${i})">✓</button></div>`}).join('');
  }else rows=WARM_PULL.map((L,i)=>`<div class="srow warm ${e.warm[i].done?'done':''}" style="grid-template-columns:38px minmax(0,1fr) 70px 34px"><div class="c-set">W${i+1}</div><div class="c-prev">${L.label}</div><div style="text-align:center;font-weight:600">${L.txt}</div><button class="chk ${e.warm[i].done?'on':''}" onclick="A.toggleWarm(${i})">✓</button></div>`).join('');
  return `<div class="sec-h">Warm-up · 3 levels ${ex.type==='W'?'<span style="text-transform:none;letter-spacing:0;font-weight:500">(auto from your working weight)</span>':''}</div><div class="sets">${rows}</div>`}
function vLog(k,it){
  const ex=EX(it.ex),e=entry(k,it,true),sug=suggest(it,k),T=TYPES[ex.type];
  const partner=it.ss?itemsFor(k).find(x=>x.ss===it.ss&&x.uid!==it.uid):null;
  const anyDone=e.sets.some(x=>x.done);
  let h=`<div class="card"><div class="tgt"><div><b>${fmtTarget(it,ex)}</b>${T.w||ex.type==='B'||ex.type==='R'?' <span class="mu">@ RPE 7–8</span>':''}<div class="sm mu">${it.rest[1]?'Rest '+fmtRest(it.rest):'No timed rest'}${partner?` · Superset with <b>${esc(EX(partner.ex).n)}</b>: alternate sets`:''}</div></div><div class="thumb" style="width:60px;height:52px">${thumbSVG(ex.anim)}</div></div>
  ${T.w||ex.type==='B'?`<div class="sm mu" style="margin-top:8px">RPE 7–8 = you could do 2–3 more reps. Every set at RPE 8 or easier → add weight next time. RPE 9–10 or missed reps → drop 5–10%.</div>`:''}
  ${ex.note?`<div class="sm" style="margin-top:8px;color:#ffc067">${esc(ex.note)}</div>`:''}</div>`;
  if(!anyDone)h+=`<div class="sug ${sug.dir||''}"><span>💡 ${esc(sug.text)}</span>${sug.w!=null&&T.w?`<button onclick="A.applySug(${sug.w})">Use ${fmtW(sug.w)} lb</button>`:''}</div>`;
  h+=warmBlock(k,it,e,ex);
  h+=`<div class="sec-h">Working sets${ex.uni?' · L and R logged separately':''}</div><div class="sets">${setHeader(ex)}${e.sets.map((_,i)=>setRow(k,it,e,ex,i,sug)).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="btn sp" onclick="A.addSet()">+ Add set</button><button class="btn" onclick="A.rmSet()">− Remove set</button></div>
  <div class="sec-h">Notes</div><textarea class="in" placeholder="How did it feel? Machine settings, cues…" onchange="A.note(this.value)">${esc(e.note)}</textarea>
  <div class="sec-h">Plan</div><div class="row"><button class="btn danger sp" onclick="A.rmToday()">Remove today</button><button class="btn danger sp" onclick="A.rmPlan()">Remove from every ${DOW[pk(k).getDay()]}</button></div>`;
  return h}
function exHist(exId){const out=[];for(const k of Object.keys(S.sessions).sort())for(const e of Object.values(S.sessions[k].entries))if(e.ex===exId&&e.sets.some(s=>s.done))out.push({k,e});return out}
const MET={
 heavy:{l:'Heaviest weight',u:'lb',f:e=>Math.max(0,...doneSets(e).map(x=>+x.w||0))},
 orm:{l:'Est. 1RM',u:'lb',f:e=>Math.round(Math.max(0,...doneSets(e).map(x=>(+x.w&&+x.v)?e1rm(+x.w,+x.v):0)))},
 setvol:{l:'Best set volume',u:'lb',f:e=>Math.max(0,...doneSets(e).map(x=>(+x.w||0)*(+x.v||0)))},
 vol:{l:'Session volume',u:'lb',f:sessVol},
 reps:{l:'Most reps',u:'reps',f:e=>Math.max(0,...doneSets(e).map(x=>+x.v||0))},
 treps:{l:'Total reps',u:'reps',f:e=>doneSets(e).reduce((a,x)=>a+(+x.v||0),0)},
 hold:{l:'Longest hold',u:'s',f:e=>Math.max(0,...doneSets(e).map(x=>+x.v||0))},
 dur:{l:'Total time',u:'min',f:e=>doneSets(e).reduce((a,x)=>a+(+x.v||0),0)},
 hr:{l:'Avg heart rate',u:'bpm',f:e=>{const h=doneSets(e).map(x=>+x.hr).filter(x=>x>0);return h.length?Math.round(mean(h)):null}},
 dist:{l:'Distance',u:'m',f:e=>doneSets(e).reduce((a,x)=>a+(+x.v||0),0)},
 rest:{l:'Avg rest',u:'s',f:e=>{const r=e.sets.filter(x=>x.rest!=null).map(x=>x.rest);return r.length?Math.round(mean(r)):null}},
};
function metsFor(ex){return {W:['heavy','orm','setvol','vol','rest'],B:['reps','treps','heavy','rest'],R:['treps','rest'],T:['hold','rest'],C:['dur','hr'],D:['dist','rest'],WD:['heavy','dist','rest']}[ex.type]}
function chart(pts,o){o=o||{};
  if(!pts.length)return '<div class="empty">No history yet. Log a session and your graph starts here.</div>';
  const W=320,H=160,pl=36,pr=12,pt=14,pb=24,ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(o.band&&o.band[1]){lo=Math.min(lo,o.band[0]);hi=Math.max(hi,o.band[1])}
  if(hi===lo){hi+=1;lo=Math.max(0,lo-1)}const pad=(hi-lo)*.15;lo=Math.max(0,lo-pad);hi+=pad;
  const X=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g='';for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`}
  if(o.band&&o.band[1])g+=`<rect x="${pl}" width="${W-pl-pr}" y="${Y(o.band[1])}" height="${Math.max(2,Y(o.band[0])-Y(o.band[1]))}" fill="rgba(47,191,113,.13)"/><text x="${W-pr}" y="${Y(o.band[1])-3}" text-anchor="end" style="fill:#6fe0a4">target</text>`;
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  const area=path+` L${X(pts.length-1).toFixed(1)},${H-pb} L${X(0).toFixed(1)},${H-pb} Z`;
  g+=`<defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3d8bfd" stop-opacity=".35"/><stop offset="1" stop-color="#3d8bfd" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#ag)"/><path d="${path}" fill="none" stroke="#3d8bfd" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{g+=p.gold?`<circle cx="${X(i)}" cy="${Y(p.y)}" r="5.5" fill="url(#gg)" stroke="#a87b10"><title>${fmtD(p.k)}: ${p.y} ${o.u||''} · PR</title></circle>`:`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="var(--bg)" stroke="#3d8bfd" stroke-width="2"><title>${fmtD(p.k)}: ${p.y} ${o.u||''}</title></circle>`});
  g+=`<text x="${X(0)}" y="${H-6}" text-anchor="${pts.length===1?'middle':'start'}">${fmtD(pts[0].k)}</text>`;if(pts.length>1)g+=`<text x="${X(pts.length-1)}" y="${H-6}" text-anchor="end">${fmtD(pts[pts.length-1].k)}</text>`;
  const last=pts[pts.length-1];
  return `<div class="row" style="margin-bottom:4px"><b style="font-size:20px">${last.y}</b><span class="mu sm">${o.u||''} · last session</span></div><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`}
function vDetails(exId,it,k){

   <div class="mchips">${(ex.pm||[]).map(x=>`<span class="tag" style="background:#3d8bfd;color:#fff">${MUS[x]}</span>`).join('')}${(ex.sm||[]).map(x=>`<span class="tag" style="background:#2b4f86;color:#fff">${MUS[x]}</span>`).join('')}${!(ex.pm||[]).length&&!(ex.sm||[]).length?'<span class="sm mu">Conditioning / coordination</span>':''}</div></div>`;
  h+=`<div class="sec-h">How to do it</div><div class="card"><ol class="steps">${(ex.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${ex.feel?`<p class="sm" style="margin:8px 0 4px"><b>Feel it:</b> ${esc(ex.feel)}</p>`:''}${ex.avoid?`<p class="sm" style="margin:4px 0"><b>Avoid:</b> ${esc(ex.avoid)}</p>`:''}</div>`;
  h+=`<div class="sec-h">Target & progression</div><div class="card sm"><b>${tgt}</b>${TYPES[ex.type].w||ex.type==='B'?' at RPE 7–8 (2–3 reps left in the tank).':''}${it&&it.rest[1]?` Rest ${fmtRest(it.rest)} between sets.`:''}
   ${TYPES[ex.type].w?'<ul style="margin:8px 0 0;padding-left:18px"><li>All sets done at RPE 8 or easier → add 5 lb next time (10 lb if it felt RPE 6).</li><li>Between RPE 8 and 9 → stay at this weight.</li><li>RPE 9–10, or you missed reps → drop 5–10%.</li></ul>':''}${ex.note?`<p style="color:#ffc067;margin:8px 0 0">${esc(ex.note)}</p>`:''}</div>`;
  h+=`<div class="sec-h">Progress</div><div class="chips">${mets.map(x=>`<button class="chip ${x===m?'on':''}" onclick="A.metric('${exId}','${x}')">${MET[x].l}</button>`).join('')}</div><div class="card">${chart(pts,{u:MET[m].u,band:m==='rest'?band:null})}</div>`;
  const st=histStats(exId,null);
  if(hist.length){
    const best=(f)=>{let b=null;hist.forEach(x=>{const v=f(x.e);if(v!=null&&(!b||v>b.v))b={v,k:x.k}});return b};
    const cells=[];const T=TYPES[ex.type];
    const addC=(lab,f,u)=>{const b=best(f);if(b&&b.v>0)cells.push(`<div><div class="k">${lab}</div><div class="v">${MEDAL()}${fmtW(Math.round(b.v*10)/10)} <span class="sm mu">${u}</span></div><div class="d">${fmtD(b.k)}</div></div>`)};
    if(T.w){addC('Heaviest weight',MET.heavy.f,'lb');if(ex.type==='W'){addC('Best est. 1RM',MET.orm.f,'lb');addC('Best set volume',MET.setvol.f,'lb');addC('Best session volume',MET.vol.f,'lb')}else addC('Longest carry',MET.dist.f,'m')}
    else if(ex.type==='B'){addC('Most reps',MET.reps.f,'reps');if(st.maxW>0)addC('Heaviest added',MET.heavy.f,'lb')}
    else if(ex.type==='T')addC('Longest hold',MET.hold.f,'s');else if(ex.type==='C')addC('Longest session',MET.dur.f,'min');else addC('Best total',MET.treps.f,unitOf(ex));
    const nb=hist.reduce((a,x)=>a+x.e.sets.reduce((b,s)=>b+(s.pr?s.pr.length:0),0)+(x.e.prs?x.e.prs.length:0),0);
    cells.push(`<div><div class="k">Gold badges earned</div><div class="v">${MEDAL()}${nb}</div><div class="d">${hist.length} session${hist.length>1?'s':''} logged</div></div>`);

  }

    else{const a=Math.round(mean(rs.slice(-3)));const c=restClass(a,band);
      v=`Last ${Math.min(3,rs.length)} session${rs.length>1?'s':''}: average <b>${fmtClock(a)}</b> vs target <b>${fmtRest(band)}</b>. `+(c==='long'?'You\'re resting longer than needed. Shorter rests keep your heart rate up, which is closer to game demands.':c==='short'?'You\'re resting less than the target. If your reps are dropping, rest a bit longer so you can keep the weight up.':'Right on target.');
      if(rs.length>1){const d=rs[rs.length-1]-rs[0];v+=` Trend since your first session: ${d>0?'+':''}${fmtClock(Math.abs(d)).replace(/^/,d<0?'−':'')}.`}}

function loadRange(a,b){const m={},bad=[];let sets=0,vol=0,days=0,exs=0,rests=[0,0,0];
  for(const [k,s] of Object.entries(S.sessions)){if(k<a||k>b)continue;let any=!!(s.soccer||s.bball);

      (X.pm||[]).forEach(mm=>m[mm]=(m[mm]||0)+n);(X.sm||[]).forEach(mm=>m[mm]=(m[mm]||0)+n*.5);

   }else{s.pr=[];s.rest=null;if(S.timer&&S.timer.uid===it.uid&&S.timer.idx===idx){S.timer=null;buildTimer()}e.done=false;e.prs=[]}
   save();ui.sheet.keep=true;renderSheet();render()},
 addSet(){const {ex,e}=curSheet();const i=e.sets.length?e.sets[e.sets.length-1].i+1:0;const last=e.sets[e.sets.length-1];for(const side of(ex.uni?['L','R']:[null]))e.sets.push({i,side,w:last?last.w:null,v:null,rpe:null,done:false,rest:null});save();ui.sheet.keep=true;renderSheet()},
 rmSet(){const {ex,e}=curSheet();const n=ex.uni?2:1;if(e.sets.length<=n)return;const tail=e.sets.slice(-n);if(tail.some(x=>x.done)&&!confirm('Remove a completed set?'))return;e.sets.splice(-n,n);e.done=e.sets.every(x=>x.done);save();ui.sheet.keep=true;renderSheet();render()},
 note(v){const {e}=curSheet();e.note=v;save()},
 rmToday(){const {k,it}=curSheet();if(!confirm(`Remove ${EX(it.ex).n} from today?`))return;const s=sess(k,true);s.items=s.items.filter(i=>i.uid!==it.uid);delete s.entries[it.uid];s.started=s.started.filter(u=>u!==it.uid);save();A.close()},
 rmPlan(){const {k,it}=curSheet(),d=pk(k).getDay();if(!confirm(`Remove ${EX(it.ex).n} from every ${DOW[d]}?`))return;S.plan[d]=S.plan[d].filter(i=>i.uid!==it.uid);const s=sess(k,true);s.items=s.items.filter(i=>i.uid!==it.uid);delete s.entries[it.uid];s.started=s.started.filter(u=>u!==it.uid);syncPlan(d);save();A.close()},
 tAdj(n){if(!S.timer)return;S.timer.dur=Math.max(5,S.timer.dur+n);S.timer.beeped=false;save();tickTimer()},
 tEnd(){finishTimer(false);if(ui.sheet){ui.sheet.keep=true;renderSheet()}},
 pick(mode,dow){ui.picker={mode,dow,q:''};renderPicker()},
 pickClose(){ui.picker=null;renderPicker()},
 pickQ(q){ui.picker.q=q;$('#plist').innerHTML=pickList()},
 scope(s){ui.addScope=s;renderPicker()},
 pickAdd(id){const ex=EX(id),p=ui.picker;const def={T:30,C:15,D:40,WD:30}[ex.type]||10;const it=I(id,ex.type==='C'?1:3,def,ex.type==='C'?[0,0]:ex.type==='T'?[30,45]:[60,90]);it.uid='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
   if(p.mode==='today'&&ui.addScope==='today'){it.extra=true;sess(ui.date,true).items.push(it)}
   else{const d=p.mode==='today'?pk(ui.date).getDay():p.dow;S.plan[d].push(it);if(p.mode==='today'){const s=sess(ui.date,true);s.items.push(clone(it))}syncPlan(d)}
   save();ui.picker=null;renderPicker();render();toast('Added '+ex.n)},
 popen(d){ui.planOpen=ui.planOpen===d?-1:d;render()},
 dayInfo(d,f,v){S.days[d][f]=v;save()},
 pmove(d,i,dir){const a=S.plan[d],j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];syncPlan(d);save();render()},
 prm(d,i){const it=S.plan[d][i];if(!confirm(`Remove ${EX(it.ex).n} from every ${DOW[d]}?`))return;S.plan[d].splice(i,1);syncPlan(d);save();render()},
 pset(d,i,f,v){const it=S.plan[d][i];v=Math.max(0,+v||0);if(f==='sets')it.sets=Math.max(1,v);else if(f==='target')it.target=Math.max(1,v);else if(f==='r0')it.rest[0]=v;else it.rest[1]=v;syncPlan(d);save()},
 presetDay(d){if(!confirm(`Reset ${DOW[d]} to the default plan?`))return;S.plan[d]=buildPlan()[d];S.days[d]=clone(DAYS_DEFAULT[d]);syncPlan(d);save();render()},
 prange(r){ui.prog.range=r;ui.prog.off=0;render()},
 poff(n){ui.prog.off=Math.min(0,ui.prog.off+n);render()},
 addBW(){const v=+$('#bwin').value;if(!v||v<50||v>500){toast('Enter your weight in lb');return}const k=todayK();S.bw=S.bw.filter(x=>x.k!==k);S.bw.push({k,w:v});save();render();toast('Weight logged')},
 libQ(q){ui.libQ=q;$('#llist').innerHTML=libList()},
 libCat(c){ui.libCat=c;render()},
 newEx(){form={n:'',type:'W',uni:'',wg:'',eq:'db',anim:'stand',pm:[],sm:[],steps:''};ui.picker=null;renderPicker();ui.sheet={form:true,exId:'_'};renderSheet()},
 ff(f,v){form[f]=v;if(f!=='n'&&f!=='steps'){ui.sheet.keep=true;renderSheet()}},
 fm(m){const f=form;if(f.pm.includes(m)){f.pm=f.pm.filter(x=>x!==m);f.sm.push(m)}else if(f.sm.includes(m))f.sm=f.sm.filter(x=>x!==m);else f.pm.push(m);ui.sheet.keep=true;renderSheet()},
 saveEx(){const f=form;if(!f.n.trim()){toast('Give it a name');return}const id='c_'+Date.now().toString(36);
   S.custom[id]={n:f.n.trim(),type:f.type,uni:f.uni||undefined,wg:f.wg||undefined,eq:f.eq,anim:f.anim,pm:f.pm,sm:f.sm,cat:'Custom',steps:f.steps.split('\n').map(x=>x.trim()).filter(Boolean)};
   save();form=null;ui.sheet={exId:id,tab:'det'};renderSheet();render();toast('Saved '+f.n)},
 exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`propath-backup-${todayK()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
 importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!d.plan)throw 0;if(!confirm('Replace all data in this browser with this backup?'))return;S=d;save();rerenderAll();toast('Backup restored')}catch(e){toast('That file isn\'t a ProPath backup')}};r.readAsText(file)},
 resetAll(){if(!confirm('Erase ALL workouts, plan edits and records from this browser? This cannot be undone.'))return;S=fresh();save();rerenderAll();toast('Everything erased')},
};
window.A=A;
render();buildTimer();
</script>
